<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOCI-Prudential — Chat Widget Mockup (DEMO)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- client website backdrop — drop the screenshot here -->
<div class="site" id="site">
  <div class="slot">
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 15l4.5-4.5 3.5 3.5 3-3L21 17"/><circle cx="8.5" cy="8.5" r="1.2"/></svg></div>
    <b>Client website screenshot goes here</b>
    <p>Supply a screenshot of the BOCIPT website and it will fill this area, with the chat widget sitting on top of it.</p>
    <p class="hint">Save the screenshot as <code>site.png</code> next to <code>index.html</code> and it will appear here automatically.</p>
  </div>
</div>

<!-- demo control: consent variant switcher (not part of the product) -->
<div class="switcher" id="switcher">
  <div class="sw-t">Consent screen</div>
  <button class="sw" data-m="A"><b>A</b><span>Modal</span></button>
  <button class="sw" data-m="B"><b>B</b><span>Chat message</span></button>
  <button class="sw" data-m="C"><b>C</b><span>Full terms</span></button>
</div>

<!-- launcher -->
<button class="launcher" id="launcher" onclick="openPanel()">
  <img class="licon" id="licon" alt="">
  <svg viewBox="0 0 24 24"><path d="M12 3C6.9 3 2.8 6.6 2.8 11c0 2.5 1.3 4.7 3.4 6.2L5 21.5l4.2-2.1c.9.2 1.8.3 2.8.3 5.1 0 9.2-3.6 9.2-8S17.1 3 12 3z"/></svg>
</button>

<!-- panel -->
<div class="panel" id="panel">
  <div class="hd">
    <div class="logo"><img class="brand" id="brand" alt=""><span>BOCI<br>PT</span></div>
    <div class="ttl">
      <b id="hTitle"></b><small id="hSub"></small>
    </div>
    <div class="acts">
      <select class="lang" id="lang" onchange="setLang(this.value)">
        <option value="en">EN</option><option value="tc">繁</option><option value="sc">简</option>
      </select>
      <button class="ib" onclick="toggleMax()" title="Expand">
        <svg viewBox="0 0 24 24"><path d="M9 3H3v6M15 21h6v-6M3 9V3h6M21 15v6h-6"/></svg>
      </button>
      <button class="ib" onclick="closePanel()">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <div class="msgs" id="msgs"></div>

  <div class="foot" id="foot"></div>
  <div class="inpblock" id="inpBlock" style="display:none">
    <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
    <span id="inpBlockText"></span>
  </div>
  <div class="inp" id="inp">
    <textarea id="ta" rows="1" onkeydown="key(event)" oninput="grow(this)"></textarea>
    <button class="send" onclick="send()" id="sendBtn">
      <svg viewBox="0 0 24 24"><path d="M20 12l-16-8 6 8-6 8z"/></svg>
    </button>
  </div>

  <!-- disclaimer -->
  <div class="mask" id="mask" style="display:none">
    <div class="disc">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 9v5M12 17h.01"/></svg></div>
      <h2 id="dTitle"></h2>
      <p id="dBody"></p>
      <p class="acc" id="dAcc"></p>
      <div class="btns">
        <button class="b2" onclick="decline()" id="dNo"></button>
        <button class="b1" onclick="accept()" id="dYes"></button>
      </div>
    </div>
  </div>

</div>

/* ================= MARKDOWN ================= */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){
  s=esc(s);
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  s=s.replace(/\[(.+?)\]\((.+?)\)/g,'<a href="#" onclick="return false">$1</a>');
  return s;
}
function md(src){
  const L=src.split('\n'); let out='',i=0;
  while(i<L.length){
    let l=L[i];
    if(!l.trim()){i++;continue}
    if(/^###\s/.test(l)){out+='<h3>'+inline(l.replace(/^###\s/,''))+'</h3>';i++;continue}
    if(/^[-*]\s/.test(l)){
      out+='<ul>';
      while(i<L.length&&/^[-*]\s/.test(L[i])){out+='<li>'+inline(L[i].replace(/^[-*]\s/,''))+'</li>';i++}
      out+='</ul>';continue}
    if(/^\d+\.\s/.test(l)){
      out+='<ol>';
      while(i<L.length&&/^\d+\.\s/.test(L[i])){out+='<li>'+inline(L[i].replace(/^\d+\.\s/,''))+'</li>';i++}
      out+='</ol>';continue}
    let p=[];
    while(i<L.length&&L[i].trim()&&!/^###\s|^[-*]\s|^\d+\.\s/.test(L[i])){p.push(L[i]);i++}
    out+='<p>'+inline(p.join(' '))+'</p>';
  }
  return out;
}

/* ================= CHART SVG ================= */
function chart(){
  const pts=[28,26,30,27,32,31,35,33,38,36,41,44,42,46];
  const w=560,h=150,px=34,py=14,mx=Math.max(...pts),mn=Math.min(...pts);
  const X=i=>px+i*((w-px-10)/(pts.length-1));
  const Y=v=>h-py-((v-mn)/(mx-mn))*(h-py*2);
  let path=pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  let area=path+' L'+X(pts.length-1).toFixed(1)+' '+(h-py)+' L'+px+' '+(h-py)+' Z';
  let grid='';
  for(let g=0;g<=3;g++){const y=py+g*((h-py*2)/3);grid+='<line x1="'+px+'" y1="'+y+'" x2="'+(w-10)+'" y2="'+y+'" stroke="#EDF0F3" stroke-width="1"/>';}
  const mon=['O','N','D','J','F','M','A','M','J','J','A','S','O','S'];
  let xl='';
  pts.forEach((v,i)=>{if(i%2===0)xl+='<text x="'+X(i)+'" y="'+(h-2)+'" font-size="9" fill="#98A0AE" text-anchor="middle">'+mon[i]+'</text>';});
  return '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+
    '<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="#BB0017" stop-opacity=".16"/><stop offset="100%" stop-color="#BB0017" stop-opacity="0"/>'+
    '</linearGradient></defs>'+grid+
    '<path d="'+area+'" fill="url(#g1)"/>'+
    '<path d="'+path+'" fill="none" stroke="#BB0017" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+X(pts.length-1)+'" cy="'+Y(pts[pts.length-1])+'" r="3.5" fill="#BB0017"/>'+xl+
    '<text x="'+px+'" y="'+(py-3)+'" font-size="9" fill="#98A0AE">NAV/unit</text></svg>';
}

/* ================= ACCOUNT CARD ================= */
function acctCard(){
  const t=C[lang],a=t.acct;
  let seg='',leg='';
  a.alloc.forEach(([n,p,c])=>{seg+='<i style="width:'+p+'%;background:'+c+'"></i>';
    leg+='<span><em style="background:'+c+'"></em>'+esc(n)+' '+p+'%</span>';});
  return '<div class="acct">'+
    '<div class="top"><span>'+esc(t.memberName)+'</span><span>'+esc(t.memberId)+'</span></div>'+
    '<div class="bal"><small>'+esc(t.balLabel)+'</small>'+
    '<b>'+esc(a.bal)+'</b><div class="gl '+a.glCls+'">'+esc(a.gl)+'</div></div>'+
    '<div class="alloc"><div class="t">'+esc(t.allocTitle)+'</div><div class="seg">'+seg+'</div><div class="legend">'+leg+'</div></div>'+
    '</div>'+
    '<div class="asat">'+esc(t.asatPrefix)+' <b>'+esc(a.asat)+'</b> · '+esc(t.asatNote)+'</div>';
}

/* ================= REFUSAL ================= */
function refuseBlock(){
  const t=C[lang],r=t.refuse;
  let rows=r.alt.map(([h,b])=>'<li><b>'+esc(h)+'</b> — '+esc(b)+'</li>').join('');
  return '<div class="refuse"><b>'+esc(r.t)+'</b><br>'+esc(r.b)+'</div>'+
    '<ul style="margin:0 0 9px;padding-left:19px">'+rows+'</ul>';
}

/* ================= RENDER ================= */
/* Shared blocked-input behaviour. Before consent the textarea and send button
   are disabled and a short localised hint explains why. All three consent
   variants use this, so the room compares layouts, not layouts-plus-locking. */
function setInputBlocked(b){
  const ta=$('ta'), btn=$('sendBtn'), bar=$('inpBlock');
  ta.disabled=b; btn.disabled=b;
  $('inp').classList.toggle('locked',b);
  bar.style.display=b?'flex':'none';
  $('inpBlockText').textContent=consentMode==='C'?C[lang].cBlockedLabel:C[lang].blockedHint;
  if(b){ ta.blur() }
}

/* ================= VARIANT C: EXTENDED TERMS DRAWER ================= */
/* The drawer opens to the LEFT of the widget. It only gets its own space when
   there is genuinely room beside the panel, leaving the demo switcher clear;
   otherwise the same terms content is rendered inside the panel. */
const SW_RESERVE=200;   /* switcher sits at left:16 width:168 -> keep clear of 192 */
const DRAWER_GAP=12, DRAWER_MAX_W=460, DRAWER_MIN_W=260;
let termsRead=false;

function renderTerms(){
  const t=C[lang];
  $('terms').innerHTML=
    '<div class="th"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>'+
      '<b>'+esc(t.cTitle)+'</b>'+
      '<button class="tx" onclick="decline()" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'+
    /* PLACEHOLDER marker is rendered in the UI, not just in a comment, so nobody
       mistakes this demo copy for approved legal text. */
    '<div class="tph">'+esc(t.cPlaceholder)+'</div>'+
    '<div class="tscroll" id="tscroll">'+
      t.cSections.map(s=>'<h3>'+esc(s.h)+'</h3><p>'+esc(s.p)+'</p>').join('')+
    '</div>'+
    '<div class="tfoot"><div class="thint" id="thint">'+esc(t.cScrollHint)+'</div>'+
      '<div class="tbtns"><button class="b2" onclick="decline()">'+esc(t.cBack)+'</button>'+
      '<button class="b1" id="cYes" onclick="accept()" disabled>'+esc(t.cConfirm)+'</button></div></div>';
  /* rebuilt content => the reader must scroll to the end again */
  termsRead=false;
  armConfirm();
  const sc=$('tscroll');
  sc.scrollTop=0;
  sc.addEventListener('scroll',()=>{
    if(termsRead)return;
    if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-4){ termsRead=true; armConfirm() }
  });
}
function armConfirm(){
  const y=$('cYes'); if(!y)return;
  y.disabled=!termsRead;
  const h=$('thint'); if(h)h.classList.toggle('read',termsRead);
}
/* Work out where the terms drawer goes, and whether there is room for a side
   drawer at all. Geometry is measured, not assumed, so the maxed panel and a
   resized window both land in the right place. Returns true if side mode. */
function placeTerms(){
  const el=$('terms'), P=$('panel'), pr=P.getBoundingClientRect();
  const avail=Math.floor(pr.left-DRAWER_GAP-SW_RESERVE);
  const side=avail>=DRAWER_MIN_W;
  el.classList.toggle('side',side);
  el.classList.toggle('inpanel',!side);
  if(side){
    const w=Math.min(DRAWER_MAX_W,avail);
    el.style.left=Math.round(pr.left-DRAWER_GAP-w)+'px';
    el.style.width=w+'px';
  }else{
    el.style.left=Math.round(pr.left)+'px';
    el.style.width=Math.round(pr.width)+'px';
  }
  el.style.top=Math.round(pr.top)+'px';
  el.style.height=Math.round(pr.height)+'px';
  return side;
}

/* Consent presentation is mode-switched, but every variant funnels through the
   same accept() / decline() so the state machine never forks. */
function hideAllConsent(){ $('mask').style.display='none'; $('terms').style.display='none'; }
function showConsent(){
  hideAllConsent();
  if(consentMode==='B'){ /* variant B lives inside the message log */ }
  else if(consentMode==='C'){ placeTerms(); renderTerms(); $('terms').style.display='flex' }
  else $('mask').style.display='flex';
  drawMsgs();
}
function hideConsent(){ hideAllConsent(); }
window.addEventListener('resize',()=>{ if(consentMode==='C'&&!agreed&&$('terms').style.display!=='none') placeTerms() });

/* demo control: switch consent variant. Always previews from a clean state. */
function setConsent(m){
  consentMode=m;
  document.querySelectorAll('.switcher .sw').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  /* demo control: always preview the chosen variant from a clean state */
  agreed=false; hist=[]; setInputBlocked(true);
  if(!$('panel').classList.contains('open')) openPanel(); else showConsent();
}
document.querySelectorAll('.switcher .sw').forEach(b=>b.addEventListener('click',()=>setConsent(b.dataset.m)));
document.querySelector('.switcher .sw').classList.add('on');

function render(){
  const t=C[lang];
  document.documentElement.lang = lang==='en'?'en':'zh-HK';
  $('hTitle').textContent=t.title; $('hSub').textContent=t.hsub;
  $('foot').textContent=t.foot;
  $('ta').placeholder=signed?t.phIn:t.ph;
  $('dTitle').textContent=t.dTitle; $('dBody').textContent=t.dBody; $('dAcc').textContent=t.dAcc;
  $('dYes').textContent=t.dYes; $('dNo').textContent=t.dNo;
  setInputBlocked(!agreed);
  drawMsgs();
  /* variant C open: rebuild the terms in the new language and re-arm the
     scroll-to-end gate, since the content just changed */
  if(consentMode==='C'&&!agreed&&$('terms').style.display!=='none'){ placeTerms(); renderTerms() }
}

function citesHtml(c){
  const t=C[lang];
  if(c===null||c===undefined) return '';
  if(!c.length) return '<div class="nocite">'+esc(t.nocite)+'</div>';
  let items=c.map((x,i)=>'<a href="#" onclick="return false"><i>['+(i+1)+']</i>'+
    '<span>'+esc(x[0])+'<u>'+esc(x[1])+'</u></span></a>').join('');
  return '<div class="cites"><div class="ct"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>'+
    esc(t.citesTitle)+'</div>'+items+'</div>';
}

function fuHtml(list, title){
  const t=C[lang];
  if(!list||!list.length)return '';
  return '<div class="fu"><div class="ft">'+esc(title||t.fuTitle)+'</div>'+
    list.map(q=>'<button onclick="ask(\''+q.replace(/'/g,"\\'")+'\')">'+esc(q)+'</button>').join('')+'</div>';
}

function greetPack(){
  const t=C[lang];
  return { md:t.greet, fu:[t.q.markdown.ask, t.q.image.ask, t.q.routing.ask] };
}

/* System-message mark. The robot fills it when icon.png loads; otherwise the
   letters stay, same fallback as the launcher. */
function avHtml(){
  return '<div class="av"><img alt="" src="'+ICON_SRC+'"><span>AI</span></div>';
}

/* Variant B — consent as the first bot bubble. Reuses accept()/decline() so the
   state machine does not fork, and adds no new inline handler names. */
function consentBubble(){
  const t=C[lang];
  const body = '<h3>'+esc(t.dTitle)+'</h3><p>'+esc(t.dBody)+'</p><p class="cacc">'+esc(t.dAcc)+'</p>'+
      '<div class="cbtns"><button class="b1" onclick="accept()">'+esc(t.dYes)+'</button>'+
      '<a class="cno" onclick="decline()">'+esc(t.dNo)+'</a></div>';
  return '<div class="row bot consent" id="consentRow">'+avHtml()+
    '<div class="col"><div class="bub">'+body+'</div></div></div>';
}

function drawMsgs(){
  const t=C[lang], box=$('msgs');
  if(!agreed){
    /* variant B: consent arrives as the first bot bubble, so it is drawn here
       instead of blanking the log. Variants A/C keep the log empty. */
    box.innerHTML = consentMode==='B' ? consentBubble() : '';
    box.scrollTop=0;
    return;
  }
  if(!hist.length){
    box.innerHTML='<div class="empty"><div class="em"><svg viewBox="0 0 24 24"><path d="M12 3C6.9 3 2.8 6.6 2.8 11c0 2.5 1.3 4.7 3.4 6.2L5 21.5l4.2-2.1c.9.2 1.8.3 2.8.3 5.1 0 9.2-3.6 9.2-8S17.1 3 12 3z"/></svg></div>'+
      '<h3>'+esc(t.emptyH)+'</h3><p>'+esc(t.emptyP)+'</p><div class="chips">'+
      [ 'markdown','image','routing' ].map(k=>'<button onclick="demo(\''+k+'\')">'+esc(t.q[k].ask)+'</button>').join('')+
      '</div></div>';
    return;
  }
  let h='';
  hist.forEach(m=>{
    if(m.k==='user'){ h+='<div class="row me"><div class="bub">'+inline(m.text)+'</div></div>'; return }
    const d=m.d, inner=[];
    if(m.key==='greet'){
      h+='<div class="row bot">'+avHtml()+'<div class="col"><div class="bub">'+md(d.md)+'</div>'+
        fuHtml(d.fu, C[lang].greetChips)+'</div></div>';
      return;
    }
    if(d.refuse) inner.push(refuseBlock());
    if(d.md) inner.push(md(d.md));
    if(d.acct) inner.push(acctCard());
    if(d.img) inner.push('<figure class="figure">'+chart()+'<figcaption>'+esc(C[lang].chart.t)+' · '+esc(C[lang].chart.c)+'</figcaption></figure>');
    inner.push(citesHtml(d.cites));
    h+='<div class="row bot">'+avHtml()+'<div class="col">'+
      '<div class="bub">'+inner.join('')+
      '<div class="fb"><span>'+esc(t.fbQ)+'</span>'+
      '<button onclick="vote(this,1)" title="Helpful"><svg viewBox="0 0 24 24"><path d="M7 22V11l5-9 1 1v6h5a2 2 0 012 2.3l-1.3 7A2 2 0 0116.7 22H7z"/></svg></button>'+
      '<button onclick="vote(this,0)" title="Not helpful"><svg viewBox="0 0 24 24"><path d="M17 2v11l-5 9-1-1v-6H6a2 2 0 01-2-2.3l1.3-7A2 2 0 017.3 2H17z"/></svg></button>'+
      '</div></div>'+ fuHtml(d.fu) +'</div></div>';
  });
  box.innerHTML=h;
  box.scrollTop=box.scrollHeight;
}

/* ================= ACTIONS ================= */
function openPanel(){$('panel').classList.add('open');$('launcher').style.display='none';
  if(!agreed){showConsent()} else drawMsgs(); if(agreed)$('ta').focus()}
function closePanel(){$('panel').classList.remove('open');$('launcher').style.display='flex';
  /* the terms drawer is positioned against the panel, so it closes with it */
  $('terms').style.display='none'}
function accept(){
  agreed=true; hideConsent(); setInputBlocked(false);
  /* A is a pop-up, so the chat opens on the greeting. B and C leave the
     consent as the user's own line, and the greeting follows it. */
  if(consentMode!=='A') hist.push({k:'user', text:C[lang].consentLine, key:'consent'});
  hist.push({k:'bot', d:greetPack(), key:'greet'});
  drawMsgs();
  $('ta').focus();
}
function decline(){agreed=false;hideConsent();closePanel();setInputBlocked(true)}
function toggleMax(){maxed=!maxed;$('panel').classList.toggle('max',maxed);
  if(consentMode==='C'&&!agreed&&$('terms').style.display!=='none')placeTerms()}
function vote(btn,ok){btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel')}
function grow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,88)+'px'}
function key(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}

function match(text){
  const t=C[lang].q;
  for(const k in t){ if(t[k].ask===text) return k }
  const s=text.toLowerCase();
  for(const k in t){ if(t[k].ask.toLowerCase()===s) return k }
  if(/withdraw|提取|提取/.test(s)) return signed?'refusal':'routing';
  if(/balance|how much|結餘|结余|多少/.test(s)) return 'account';
  if(/fund|perform|基金|表現|表现/.test(s)) return 'image';
  if(/complain|late|employer|投訴|投诉|僱主|雇主/.test(s)) return 'escalate';
  return 'markdown';
}

function send(){
  const ta=$('ta'), v=ta.value.trim(); if(!v)return;
  ta.value=''; grow(ta); ask(v);
}

function ask(text){
  if(!agreed){showConsent();return}
  $('msgs').querySelector('.empty')?.remove();
  const key=match(text);
  hist.push({k:'user',text:text,key:key});
  drawMsgs();
  const box=$('msgs');
  box.insertAdjacentHTML('beforeend',
    '<div class="row bot" id="typ">'+avHtml()+'<div class="bub" style="padding:0"><div class="typing"><i></i><i></i><i></i></div></div></div>');
  box.scrollTop=box.scrollHeight;
  setTimeout(()=>{
    const el=$('typ'); if(el)el.remove();
    hist.push({k:'bot',d:C[lang].q[key],key:key});
    drawMsgs();
  },620);
}

function demo(key){
  if(!agreed){openPanel(); setTimeout(()=>{agreed=true;hideConsent();setInputBlocked(false);
    if(key==='account'&&!signed){signed=true;render()} runDemo(key)},120); return}
  if(key==='account'&&!signed){signed=true;render()}
  runDemo(key);
}
function runDemo(key){
  hist.push({k:'user',text:C[lang].q[key].ask,key:key});
  hist.push({k:'bot',d:C[lang].q[key],key:key});
  drawMsgs();
}

/* language switch: rebuild the whole conversation in the new language */
function setLang(v){
  const snap=hist.map(m=>({k:m.k, key:m.key||'markdown'}));
  lang=v;
  hist=snap.map(m=>{
    if(m.key==='consent') return {k:'user', text:C[lang].consentLine, key:'consent'};
    if(m.key==='greet') return {k:'bot', d:greetPack(), key:'greet'};
    if(m.k==='user') return {k:'user', text:C[lang].q[m.key].ask, key:m.key};
    return {k:'bot', d:C[lang].q[m.key], key:m.key};
  });
  render();
}

render();
</script>

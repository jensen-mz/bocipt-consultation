<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOCI-Prudential — Chat (mobile)</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="mobile">

<!-- client website backdrop — drop the screenshot here -->
<div class="site" id="site">
  <div class="slot">
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 15l4.5-4.5 3.5 3.5 3-3L21 17"/><circle cx="8.5" cy="8.5" r="1.2"/></svg></div>
    <b>Client website screenshot goes here</b>
    <p>Supply a screenshot of the BOCIPT website and it will fill this area, with the chat widget sitting on top of it.</p>
    <p class="hint">Save the screenshot as <code>site.png</code> next to <code>index.html</code> and it will appear here automatically.</p>
  </div>
</div>

<!-- demo control: consent variant switcher (not part of the product) -->
<div class="switcher" id="switcher">
  <div class="sw-t">Consent screen</div>
  <button class="sw" data-m="A"><b>A</b><span>Modal</span></button>
  <button class="sw" data-m="B"><b>B</b><span>Chat message</span></button>
  <button class="sw" data-m="C"><b>C</b><span>Full terms</span></button>
</div>

<!-- launcher -->
<button class="launcher" id="launcher" onclick="openPanel()">
  <img class="licon" id="licon" alt="">
  <svg viewBox="0 0 24 24"><path d="M12 3C6.9 3 2.8 6.6 2.8 11c0 2.5 1.3 4.7 3.4 6.2L5 21.5l4.2-2.1c.9.2 1.8.3 2.8.3 5.1 0 9.2-3.6 9.2-8S17.1 3 12 3z"/></svg>
</button>

<!-- panel -->
<div class="panel" id="panel">
  <div class="hd">
    <div class="ttl">
      <b id="hTitle"></b>
    </div>
    <div class="acts">
      <select class="lang" id="lang" onchange="setLang(this.value)">
        <option value="en">EN</option><option value="tc">繁</option><option value="sc">简</option>
      </select>
      <button class="ib" onclick="toggleMax()" title="Expand">
        <svg viewBox="0 0 24 24"><path d="M9 3H3v6M15 21h6v-6M3 9V3h6M21 15v6h-6"/></svg>
      </button>
      <button class="ib" onclick="closePanel()">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <div class="msgs" id="msgs"></div>

  <div class="inpblock" id="inpBlock" style="display:none">
    <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
    <span id="inpBlockText"></span>
  </div>
  <div class="inp" id="inp">
    <textarea id="ta" rows="1" onkeydown="key(event)" oninput="grow(this)"></textarea>
    <button class="send" onclick="send()" id="sendBtn">
      <svg viewBox="0 0 24 24"><path d="M20 12l-16-8 6 8-6 8z"/></svg>
    </button>
  </div>
  <div class="foot" id="foot"></div>

  <!-- disclaimer -->
  <div class="mask" id="mask" style="display:none">
    <div class="disc">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 9v5M12 17h.01"/></svg></div>
      <h2 id="dTitle"></h2>
      <p id="dBody"></p>
      <p class="acc" id="dAcc"></p>
      <div class="btns">
        <button class="b2" onclick="decline()" id="dNo"></button>
        <button class="b1" onclick="accept()" id="dYes"></button>
      </div>
    </div>
  </div>

</div>

<!-- variant C: extended terms. Opens as a drawer to the LEFT of the widget on a
     wide viewport, or inside the panel on a narrow one. Built by renderTerms();
     the confirm button stays disabled until the reader reaches the end.
     PLACEHOLDER COPY — Compliance to replace. -->
<div class="terms" id="terms" style="display:none"></div>

<script src="chat.js"></script>
<script>openPanel();</script>

</body>
</html>

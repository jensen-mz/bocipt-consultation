<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOCI-Prudential — Chat Widget Mockup (DEMO)</title>
<style>
:root{
  --red:#B3202A; --red-dk:#8E1A21; --red-lt:#F7E9EA;
  --ink:#1F2430; --ink2:#3A4150; --muted:#6B7280; --line:#E4E7EC;
  --bg:#EEF0F3; --panel:#FFFFFF; --bot:#F6F7F9; --chip:#FFFFFF;
  --teal:#1F6F6B; --amber:#B7791F; --radius:14px;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:"Segoe UI",-apple-system,"PingFang HK","Microsoft JhengHei","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
}

/* ---------- presenter bar (not part of the product) ---------- */
.bar{
  position:sticky; top:0; z-index:60; background:#151922; color:#E8EAF0;
  padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  border-bottom:1px solid #000;
}
.bar .lbl{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#8B93A7; margin-right:4px}
.bar button{
  background:#232A38; color:#E8EAF0; border:1px solid #333C4E; border-radius:8px;
  padding:6px 11px; font-size:12px; cursor:pointer; font-family:inherit;
}
.bar button:hover{background:#2E3748}
.bar button.on{background:var(--red); border-color:var(--red); color:#fff}
.bar .sep{width:1px; height:20px; background:#333C4E; margin:0 4px}
/* ---------- client website backdrop ---------- */
.site{
  position:fixed; inset:0; z-index:0; overflow:hidden;
  background:#fff center top no-repeat; background-size:cover;
}
/* empty-state: shown until a screenshot is supplied */
.slot{
  position:absolute; inset:24px; border:2px dashed #C3C9D2; border-radius:16px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; text-align:center; padding:24px; background:#FAFBFC;
}
.slot .ic{width:56px; height:56px; border-radius:14px; background:#EDF0F4;
  display:flex; align-items:center; justify-content:center}
.slot .ic svg{width:26px; height:26px; fill:none; stroke:#8A93A2; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}
.slot b{font-size:15px; color:var(--ink); font-weight:650}
.slot p{font-size:12.5px; color:var(--muted); line-height:1.7; margin:0; max-width:430px}
.slot code{background:#EDF0F4; color:#3A4150; padding:2px 7px; border-radius:5px;
  font-family:Consolas,Menlo,monospace; font-size:11.5px}
.slot .hint{font-size:11.5px; color:#98A0AE; margin-top:4px}
body.has-site .slot{display:none}

/* ---------- launcher ---------- */
.launcher{
  position:fixed; right:26px; bottom:26px; z-index:50;
  width:58px; height:58px; border-radius:50%; background:var(--red);
  border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 20px rgba(179,32,42,.4); transition:transform .15s;
}
.launcher:hover{transform:scale(1.06)}
.launcher svg{width:26px; height:26px; fill:#fff}
.launcher .dot{position:absolute; top:2px; right:2px; width:12px; height:12px; border-radius:50%;
  background:#2FBF71; border:2px solid #fff}

/* ---------- panel ---------- */
.panel{
  position:fixed; right:26px; bottom:96px; z-index:55;
  width:392px; height:640px; max-height:calc(100vh - 130px);
  background:var(--panel); border-radius:18px; overflow:hidden;
  box-shadow:0 18px 50px rgba(15,20,30,.28); display:none; flex-direction:column;
}
.panel.open{display:flex}
.panel.max{ right:16px; bottom:16px; width:calc(100vw - 32px); height:calc(100vh - 32px); max-width:760px; max-height:none}

/* header */
.hd{background:var(--red); color:#fff; padding:12px 14px; display:flex; align-items:center; gap:10px; flex:0 0 auto}
.logo{width:34px; height:34px; border-radius:8px; background:#fff; display:flex; align-items:center; justify-content:center; flex:0 0 auto}
.logo span{color:var(--red); font-weight:800; font-size:11px; letter-spacing:-.03em; line-height:1}
.hd .ttl{flex:1; min-width:0}
.hd .ttl b{display:block; font-size:14px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hd .ttl small{display:block; font-size:11px; opacity:.82; margin-top:1px}
.hd .acts{display:flex; gap:2px; flex:0 0 auto}
.ib{background:transparent; border:none; color:#fff; cursor:pointer; width:30px; height:30px; border-radius:7px;
  display:flex; align-items:center; justify-content:center; padding:0}
.ib:hover{background:rgba(255,255,255,.18)}
.ib svg{width:16px; height:16px; fill:none; stroke:#fff; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.lang{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.34); color:#fff; border-radius:7px;
  font-size:11.5px; padding:5px 7px; cursor:pointer; font-family:inherit; font-weight:600}
.lang option{color:#1F2430}

/* demo badge */
.badge{background:#7A1219; color:#FFD9DB; text-align:center; font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; padding:4px; flex:0 0 auto; font-weight:700}

/* auth strip */
.auth{background:var(--red-lt); border-bottom:1px solid #E7D3D5; padding:8px 14px; display:flex;
  align-items:center; gap:8px; font-size:12px; color:#7A2A30; flex:0 0 auto}
.auth .pill{width:7px; height:7px; border-radius:50%; background:#9AA3AF; flex:0 0 auto}
.auth.in .pill{background:#2FBF71}
.auth b{font-weight:650}
.auth a{margin-left:auto; color:var(--red); font-weight:650; cursor:pointer; text-decoration:none; white-space:nowrap}

/* messages */
.msgs{flex:1; overflow-y:auto; padding:16px 14px; background:#FBFBFC; scroll-behavior:smooth}
.msgs::-webkit-scrollbar{width:7px}
.msgs::-webkit-scrollbar-thumb{background:#D6DAE0; border-radius:4px}

.row{display:flex; gap:9px; margin-bottom:16px}
.row.me{justify-content:flex-end}
.row.bot .col{max-width:88%; flex:1; min-width:0}
.bub{min-width:0; overflow-wrap:break-word; word-break:break-word}
.av{width:28px; height:28px; border-radius:8px; background:var(--red); color:#fff; font-size:10px; font-weight:800;
  display:flex; align-items:center; justify-content:center; flex:0 0 auto; margin-top:2px}
.bub{max-width:82%; border-radius:var(--radius); padding:11px 13px; font-size:13.5px; line-height:1.62}
.row.me .bub{background:var(--red); color:#fff; border-bottom-right-radius:4px}
.row.bot .bub{background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px; color:var(--ink2); max-width:88%}

/* markdown inside bot bubble */
.bub h3{font-size:13.5px; color:var(--ink); margin:0 0 8px; font-weight:700; line-height:1.4}
.bub h3:not(:first-child){margin-top:14px}
.bub p{margin:0 0 9px}
.bub p:last-child{margin-bottom:0}
.bub ul,.bub ol{margin:0 0 9px; padding-left:19px}
.bub li{margin-bottom:5px}
.bub b,.bub strong{color:var(--ink); font-weight:700}
.bub a{color:var(--red); text-decoration:none; border-bottom:1px solid rgba(179,32,42,.3)}
.bub .lead{color:var(--ink); font-weight:600}

/* refusal */
.refuse{background:#FFF8E9; border:1px solid #F0DCA8; border-left:3px solid var(--amber);
  border-radius:9px; padding:9px 11px; margin-bottom:10px; font-size:12.5px; color:#6B4E12; line-height:1.55}
.refuse b{color:#5A4110}

/* inline image */
.figure{margin:2px 0 10px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff}
.figure svg{display:block; width:100%; height:auto}
.figure figcaption{font-size:11px; color:var(--muted); padding:7px 10px; border-top:1px solid var(--line); background:#FAFBFC}

/* account card */
.acct{border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:10px; background:#fff}
.acct .top{background:#F3F5F8; padding:9px 11px; font-size:11.5px; color:var(--muted);
  display:flex; justify-content:space-between; gap:8px; border-bottom:1px solid var(--line)}
.acct .bal{padding:12px 11px 8px}
.acct .bal small{font-size:11px; color:var(--muted); display:block; margin-bottom:3px; letter-spacing:.03em}
.acct .bal b{font-size:23px; color:var(--ink); font-weight:700; letter-spacing:-.02em}
.acct .gl{font-size:12px; margin-top:5px}
.up{color:#1B7F4B} .dn{color:var(--red)}
.acct .alloc{padding:8px 11px 11px; border-top:1px solid var(--line)}
.acct .alloc .t{font-size:11px; color:var(--muted); margin-bottom:7px}
.seg{display:flex; height:9px; border-radius:5px; overflow:hidden; margin-bottom:7px}
.seg i{display:block; height:100%}
.legend{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11px; color:var(--ink2)}
.legend span{display:flex; align-items:center; gap:5px}
.legend em{width:8px; height:8px; border-radius:2px; display:block; font-style:normal}
.asat{font-size:11px; color:var(--muted); background:#F7F8FA; border-radius:7px; padding:6px 9px; margin-bottom:10px;
  border:1px solid var(--line)}

/* citations */
.cites{margin-top:11px; padding-top:10px; border-top:1px solid var(--line)}
.cites .ct{font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
  font-weight:700; margin-bottom:7px; display:flex; align-items:center; gap:5px}
.cites .ct svg{width:11px; height:11px; fill:none; stroke:var(--muted); stroke-width:2}
.cites a{display:flex; gap:7px; align-items:flex-start; font-size:11.5px; color:var(--ink2);
  text-decoration:none; padding:5px 7px; border-radius:6px; margin:0 -7px; line-height:1.45}
.cites a:hover{background:#F4F6F8}
.cites a i{color:var(--red); font-style:normal; font-weight:700; flex:0 0 auto}
.cites a u{color:var(--muted); text-decoration:none; display:block; font-size:10.5px; margin-top:1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:250px}
.nocite{margin-top:10px; font-size:11px; color:#98A0AE; font-style:italic}

/* feedback + follow-ups */
.fb{display:flex; gap:6px; align-items:center; margin-top:11px; padding-top:9px; border-top:1px solid var(--line)}
.fb span{font-size:10.5px; color:var(--muted); margin-right:auto}
.fb button{background:#fff; border:1px solid var(--line); border-radius:6px; width:26px; height:24px;
  cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0}
.fb button:hover{background:#F3F5F8; border-color:#CBD2DC}
.fb button svg{width:13px; height:13px; fill:none; stroke:var(--muted); stroke-width:1.8; stroke-linejoin:round}
.fb button.sel{background:var(--red-lt); border-color:#E2BFC2}
.fb button.sel svg{stroke:var(--red)}
.fu{margin-top:4px}
.fu .ft{font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:7px}
.fu button{display:block; width:100%; text-align:left; background:var(--chip); border:1px solid var(--line);
  border-radius:9px; padding:8px 11px; font-size:12.5px; color:var(--ink2); cursor:pointer; margin-bottom:6px;
  font-family:inherit; line-height:1.45; transition:.12s}
.fu button:hover{border-color:var(--red); color:var(--red); background:#FFFAFA}
.fu button:last-child{margin-bottom:0}

/* typing */
.typing{display:flex; gap:4px; padding:13px 14px}
.typing i{width:6px; height:6px; border-radius:50%; background:#B6BDC8; animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s} .typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.3; transform:translateY(0)}30%{opacity:1; transform:translateY(-3px)}}

/* disclaimer */
.mask{position:absolute; inset:0; background:rgba(20,24,32,.5); z-index:20; display:flex;
  align-items:center; justify-content:center; padding:22px}
.disc{background:#fff; border-radius:14px; padding:20px 18px; max-width:330px; width:100%; text-align:center}
.disc .ic{width:40px; height:40px; border-radius:50%; background:var(--red-lt); display:flex;
  align-items:center; justify-content:center; margin:0 auto 12px}
.disc .ic svg{width:19px; height:19px; fill:none; stroke:var(--red); stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.disc h2{font-size:15px; margin:0 0 9px; color:var(--ink)}
.disc p{font-size:12px; color:var(--muted); line-height:1.65; margin:0 0 8px; text-align:left}
.disc .acc{font-size:11px; color:#98A0AE; margin:0 0 14px; text-align:left}
.disc .btns{display:flex; gap:8px}
.disc .btns button{flex:1; padding:10px; border-radius:9px; font-size:12.5px; cursor:pointer;
  font-family:inherit; font-weight:600; border:1px solid var(--line)}
.b1{background:var(--red); color:#fff; border-color:var(--red)!important}
.b1:hover{background:var(--red-dk)}
.b2{background:#fff; color:var(--ink2)}
.b2:hover{background:#F4F6F8}

/* input */
.inp{flex:0 0 auto; border-top:1px solid var(--line); padding:10px 12px; background:#fff; display:flex; gap:8px; align-items:flex-end}
.inp textarea{flex:1; border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:13px;
  font-family:inherit; resize:none; outline:none; max-height:88px; line-height:1.5; color:var(--ink); background:#FBFBFC}
.inp textarea:focus{border-color:var(--red); background:#fff}
.inp textarea::placeholder{color:#A6ADB8}
.send{width:38px; height:38px; border-radius:10px; background:var(--red); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex:0 0 auto}
.send:hover{background:var(--red-dk)}
.send:disabled{background:#D3D8DF; cursor:not-allowed}
.send svg{width:17px; height:17px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.foot{font-size:10.5px; color:#A6ADB8; text-align:center; padding:0 12px 9px; background:#fff; flex:0 0 auto}

/* empty state */
.empty{text-align:center; padding:34px 20px 20px}
.empty .em{width:46px; height:46px; border-radius:12px; background:var(--red-lt); margin:0 auto 13px;
  display:flex; align-items:center; justify-content:center}
.empty .em svg{width:22px; height:22px; fill:none; stroke:var(--red); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.empty h3{font-size:15px; margin:0 0 5px; color:var(--ink)}
.empty p{font-size:12px; color:var(--muted); margin:0 auto 18px; max-width:250px; line-height:1.6}
.empty .chips{display:flex; flex-direction:column; gap:7px; text-align:left}
.empty .chips button{background:#fff; border:1px solid var(--line); border-radius:9px; padding:9px 12px;
  font-size:12.5px; color:var(--ink2); cursor:pointer; font-family:inherit; text-align:left; line-height:1.45}
.empty .chips button:hover{border-color:var(--red); color:var(--red); background:#FFFAFA}

/* ---------- presenter annotations ---------- */
.annot{position:relative}
body.pm .annot{outline:1.5px dashed var(--red); outline-offset:2px; border-radius:6px}
.tag{display:none; position:absolute; z-index:70; background:var(--red); color:#fff; font-size:10px;
  font-weight:700; padding:3px 7px; border-radius:5px; white-space:nowrap; pointer-events:none;
  box-shadow:0 3px 10px rgba(179,32,42,.4); letter-spacing:.02em}
body.pm .tag{display:block}
.t1{top:-9px; left:10px} .t2{top:-9px; right:10px} .t3{bottom:-9px; left:10px}
.t4{top:38%; right:-6px; transform:translateX(100%)} .t5{bottom:-9px; right:12px}
.t6{top:50%; left:-6px; transform:translate(-100%,-50%)}
.legendbox{position:fixed; left:16px; bottom:16px; z-index:70; background:#151922; color:#D7DBE4;
  border-radius:12px; padding:13px 15px; font-size:11.5px; line-height:1.75; max-width:330px; display:none;
  box-shadow:0 10px 30px rgba(0,0,0,.35); border:1px solid #2A3140}
body.pm .legendbox{display:block}
.legendbox b{color:#fff; display:block; margin-bottom:7px; font-size:10px; letter-spacing:.1em; text-transform:uppercase}
.legendbox i{color:#FF8A92; font-style:normal; font-weight:700; margin-right:6px}
@media(max-width:900px){.legendbox{display:none!important}}
</style>
</head>
<body>

<div class="bar">
  <span class="lbl">Presenter</span>
  <button id="pm" onclick="togglePM()">Annotations</button>
  <div class="sep"></div>
  <span class="lbl">Response types</span>
  <button onclick="demo('markdown')">Text + citation</button>
  <button onclick="demo('image')">Image + text</button>
  <button onclick="demo('internal')">Internal doc (no citation)</button>
  <button onclick="demo('routing')">Routing to eMPF</button>
  <button onclick="demo('refusal')">Refusal / guardrail</button>
  <button onclick="demo('account')">Account card</button>
  <button onclick="demo('escalate')">Escalate to human</button>
  <div class="sep"></div>
  <button id="authBtn" onclick="toggleAuth()">Sign in</button>
  <button onclick="resetChat()">Reset</button>
</div>

<!-- client website backdrop — drop the screenshot here -->
<div class="site" id="site">
  <div class="slot">
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 15l4.5-4.5 3.5 3.5 3-3L21 17"/><circle cx="8.5" cy="8.5" r="1.2"/></svg></div>
    <b>Client website screenshot goes here</b>
    <p>Supply a screenshot of the BOCIPT website and it will fill this area, with the chat widget sitting on top of it.</p>
    <p class="hint">To set it manually: put the image next to this file and set <code>SITE_BG</code> in the script to its filename.</p>
  </div>
</div>

<!-- launcher -->
<button class="launcher annot" id="launcher" onclick="openPanel()" data-t="1">
  <span class="tag t1" id="tg1"></span>
  <span class="dot"></span>
  <svg viewBox="0 0 24 24"><path d="M12 3C6.9 3 2.8 6.6 2.8 11c0 2.5 1.3 4.7 3.4 6.2L5 21.5l4.2-2.1c.9.2 1.8.3 2.8.3 5.1 0 9.2-3.6 9.2-8S17.1 3 12 3z"/></svg>
</button>

<!-- panel -->
<div class="panel" id="panel">
  <div class="hd">
    <div class="logo"><span>BOCI<br>PT</span></div>
    <div class="ttl annot" data-t="2">
      <span class="tag t1" id="tg2"></span>
      <b id="hTitle"></b><small id="hSub"></small>
    </div>
    <div class="acts">
      <select class="lang annot" id="lang" onchange="setLang(this.value)" data-t="3">
        <option value="en">EN</option><option value="tc">繁</option><option value="sc">简</option>
      </select>
      <span class="tag t2" id="tg3"></span>
      <button class="ib annot" onclick="toggleMax()" title="Expand" data-t="4">
        <span class="tag t3" id="tg4"></span>
        <svg viewBox="0 0 24 24"><path d="M9 3H3v6M15 21h6v-6M3 9V3h6M21 15v6h-6"/></svg>
      </button>
      <button class="ib annot" onclick="newSession()" title="New session" data-t="5">
        <span class="tag t4" id="tg5"></span>
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="ib" onclick="closePanel()">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <div class="badge" id="badge"></div>

  <div class="auth annot" id="authStrip" data-t="6">
    <span class="tag t5" id="tg6"></span>
    <span class="pill"></span><span id="authText"></span><a id="authLink" onclick="toggleAuth()"></a>
  </div>

  <div class="msgs" id="msgs"></div>

  <div class="foot" id="foot"></div>
  <div class="inp annot" data-t="7">
    <span class="tag t6" id="tg7"></span>
    <textarea id="ta" rows="1" onkeydown="key(event)" oninput="grow(this)"></textarea>
    <button class="send annot" onclick="send()" id="sendBtn" data-t="8">
      <span class="tag t5" id="tg8"></span>
      <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 8 6 8z"/></svg>
    </button>
  </div>

  <!-- disclaimer -->
  <div class="mask" id="mask" style="display:none">
    <div class="disc">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 9v5M12 17h.01"/></svg></div>
      <h2 id="dTitle"></h2>
      <p id="dBody"></p>
      <p class="acc" id="dAcc"></p>
      <div class="btns">
        <button class="b2" onclick="decline()" id="dNo"></button>
        <button class="b1" onclick="accept()" id="dYes"></button>
      </div>
    </div>
  </div>
</div>

<div class="legendbox" id="legend"></div>

<script>
/* ================= CONTENT ================= */
const C = {
en:{
  h1:"Chat widget mockup", sub:"Static demo for the requirements workshop. All answers are hard-coded. No live model, no live data. Click the bubble bottom-right, or use the presenter bar to jump to a response type.",
  badge:"Demo — not a live system",
  title:"BOCI-Prudential Assistant", hsub:"MPF member support",
  foot:"Answers are generated by AI from approved documents. Always verify before acting.",
  dTitle:"Before you start", dBody:"This assistant answers general MPF questions using approved BOCI-Prudential documents. It does not give investment advice, does not recommend funds, and cannot carry out transactions. Your conversation may be reviewed to improve the service.",
  dAcc:"By continuing you confirm you have read and understood this notice.",
  dYes:"I understand", dNo:"Close",
  signIn:"Sign in", signOut:"Sign out",
  authOut:"Not signed in — general questions only",
  authIn:"Signed in as <b>C*** W**</b> · My Choice MPF",
  emptyH:"How can I help?", emptyP:"Ask about your MPF, or pick one of these.",
  ph:"Type your question…", phIn:"Ask about your account…",

      md:"### 什麼是強積金\n強制性公積金是一個退休儲蓄計劃。自2000年12月起，香港大部分18至64歲的僱員及自僱人士，**依法必須**參加。\n\n### 如何運作\n- 你及你的僱主各供款相關入息的 **5%**\n- 供款投資於你選擇的基金；如沒有選擇，則投資於**預設投資策略**\n- 一般可在 **65歲** 時提取\n\n### 你參加的是哪個計劃\n中銀保誠信託是兩個強積金計劃的信託人：\n1. 自選強積金計劃\n2. 中銀保誠簡易強積金計劃\n\n兩個計劃已於 **2025年6月5日** 轉往政府的積金易平台。",

/* ================= MARKDOWN ================= */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){
  s=esc(s);
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  s=s.replace(/\[(.+?)\]\((.+?)\)/g,'<a href="#" onclick="return false">$1</a>');
  return s;
}
function md(src){
  const L=src.split('\n'); let out='',i=0;
  while(i<L.length){
    let l=L[i];
    if(!l.trim()){i++;continue}
    if(/^###\s/.test(l)){out+='<h3>'+inline(l.replace(/^###\s/,''))+'</h3>';i++;continue}
    if(/^[-*]\s/.test(l)){
      out+='<ul>';
      while(i<L.length&&/^[-*]\s/.test(L[i])){out+='<li>'+inline(L[i].replace(/^[-*]\s/,''))+'</li>';i++}
      out+='</ul>';continue}
    if(/^\d+\.\s/.test(l)){
      out+='<ol>';
      while(i<L.length&&/^\d+\.\s/.test(L[i])){out+='<li>'+inline(L[i].replace(/^\d+\.\s/,''))+'</li>';i++}
      out+='</ol>';continue}
    let p=[];
    while(i<L.length&&L[i].trim()&&!/^###\s|^[-*]\s|^\d+\.\s/.test(L[i])){p.push(L[i]);i++}
    out+='<p>'+inline(p.join(' '))+'</p>';
  }
  return out;
}

/* ================= CHART SVG ================= */
function chart(){
  const pts=[28,26,30,27,32,31,35,33,38,36,41,44,42,46];
  const w=560,h=150,px=34,py=14,mx=Math.max(...pts),mn=Math.min(...pts);
  const X=i=>px+i*((w-px-10)/(pts.length-1));
  const Y=v=>h-py-((v-mn)/(mx-mn))*(h-py*2);
  let path=pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  let area=path+' L'+X(pts.length-1).toFixed(1)+' '+(h-py)+' L'+px+' '+(h-py)+' Z';
  let grid='';
  for(let g=0;g<=3;g++){const y=py+g*((h-py*2)/3);grid+='<line x1="'+px+'" y1="'+y+'" x2="'+(w-10)+'" y2="'+y+'" stroke="#EDF0F3" stroke-width="1"/>';}
  const mon=['O','N','D','J','F','M','A','M','J','J','A','S','O','S'];
  let xl='';
  pts.forEach((v,i)=>{if(i%2===0)xl+='<text x="'+X(i)+'" y="'+(h-2)+'" font-size="9" fill="#98A0AE" text-anchor="middle">'+mon[i]+'</text>';});
  return '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+
    '<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="#B3202A" stop-opacity=".16"/><stop offset="100%" stop-color="#B3202A" stop-opacity="0"/>'+
    '</linearGradient></defs>'+grid+
    '<path d="'+area+'" fill="url(#g1)"/>'+
    '<path d="'+path+'" fill="none" stroke="#B3202A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+X(pts.length-1)+'" cy="'+Y(pts[pts.length-1])+'" r="3.5" fill="#B3202A"/>'+xl+
    '<text x="'+px+'" y="'+(py-3)+'" font-size="9" fill="#98A0AE">NAV/unit</text></svg>';
}

    '<div class="alloc"><div class="t">'+esc(t.allocTitle)+'</div><div class="seg">'+seg+'</div><div class="legend">'+leg+'</div></div>'+

/* ================= RENDER ================= */
function render(){
  const t=C[lang];
  document.documentElement.lang = lang==='en'?'en':'zh-HK';
  $('badge').textContent=t.badge;
  $('hTitle').textContent=t.title; $('hSub').textContent=t.hsub;
  $('foot').textContent=t.foot;
  $('ta').placeholder=signed?t.phIn:t.ph;
  $('dTitle').textContent=t.dTitle; $('dBody').textContent=t.dBody; $('dAcc').textContent=t.dAcc;
  $('dYes').textContent=t.dYes; $('dNo').textContent=t.dNo;
  $('authLink').textContent=signed?t.signOut:t.signIn;
  $('authBtn').textContent=signed?t.signOut:t.signIn;
  $('authText').innerHTML=signed?t.authIn:t.authOut;
  $('authStrip').className='auth annot'+(signed?' in':'');
  $('authBtn').className=signed?'on':'';

  t.legend.forEach((x,i)=>{const el=$('tg'+(i+1)); if(el)el.textContent=x[0]});
  $('legend').innerHTML='<b>'+ (lang==='en'?'Presenter annotations':(lang==='tc'?'簡報標註':'演示标注')) +'</b>'+
    t.legend.map(x=>'<div><i>'+x[0]+'</i>'+esc(x[1])+'</div>').join('');
  drawMsgs();
}

function citesHtml(c){
  const t=C[lang];
  if(c===null||c===undefined) return '';
  if(!c.length) return '<div class="nocite">'+esc(t.nocite)+'</div>';
  let items=c.map((x,i)=>'<a href="#" onclick="return false"><i>['+(i+1)+']</i>'+
    '<span>'+esc(x[0])+'<u>'+esc(x[1])+'</u></span></a>').join('');
  return '<div class="cites"><div class="ct"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>'+
    esc(t.citesTitle)+'</div>'+items+'</div>';
}

function fuHtml(list){
  const t=C[lang];
  if(!list||!list.length)return '';
  return '<div class="fu"><div class="ft">'+esc(t.fuTitle)+'</div>'+
    list.map(q=>'<button onclick="ask(\''+q.replace(/'/g,"\\'")+'\')">'+esc(q)+'</button>').join('')+'</div>';
}

function drawMsgs(){
  const t=C[lang], box=$('msgs');
  if(!agreed){ box.innerHTML=''; return }
  if(!hist.length){
    box.innerHTML='<div class="empty"><div class="em"><svg viewBox="0 0 24 24"><path d="M12 3C6.9 3 2.8 6.6 2.8 11c0 2.5 1.3 4.7 3.4 6.2L5 21.5l4.2-2.1c.9.2 1.8.3 2.8.3 5.1 0 9.2-3.6 9.2-8S17.1 3 12 3z"/></svg></div>'+
      '<h3>'+esc(t.emptyH)+'</h3><p>'+esc(t.emptyP)+'</p><div class="chips">'+
      [ 'markdown','image','routing' ].map(k=>'<button onclick="demo(\''+k+'\')">'+esc(t.q[k].ask)+'</button>').join('')+
      '</div></div>';
    return;
  }
  let h='';
  hist.forEach(m=>{
    if(m.k==='user'){ h+='<div class="row me"><div class="bub">'+inline(m.text)+'</div></div>'; return }
    const d=m.d, inner=[];
    if(d.refuse) inner.push(refuseBlock());
    if(d.md) inner.push(md(d.md));
    if(d.acct) inner.push(acctCard());
    if(d.img) inner.push('<figure class="figure">'+chart()+'<figcaption>'+esc(C[lang].chart.t)+' · '+esc(C[lang].chart.c)+'</figcaption></figure>');
    inner.push(citesHtml(d.cites));
    h+='<div class="row bot"><div class="av">AI</div><div class="col">'+
      '<div class="bub">'+inner.join('')+
      '<div class="fb"><span>'+esc(t.fbQ)+'</span>'+
      '<button onclick="vote(this,1)" title="Helpful"><svg viewBox="0 0 24 24"><path d="M7 22V11l5-9 1 1v6h5a2 2 0 012 2.3l-1.3 7A2 2 0 0116.7 22H7z"/></svg></button>'+
      '<button onclick="vote(this,0)" title="Not helpful"><svg viewBox="0 0 24 24"><path d="M17 2v11l-5 9-1-1v-6H6a2 2 0 01-2-2.3l1.3-7A2 2 0 017.3 2H17z"/></svg></button>'+
      '</div></div>'+ fuHtml(d.fu) +'</div></div>';
  });
  box.innerHTML=h;
  box.scrollTop=box.scrollHeight;
}

/* ================= ACTIONS ================= */
function openPanel(){$('panel').classList.add('open');$('launcher').style.display='none';
  if(!agreed){$('mask').style.display='flex';drawMsgs()} else drawMsgs(); $('ta').focus()}
function closePanel(){$('panel').classList.remove('open');$('launcher').style.display='flex'}
function accept(){agreed=true;$('mask').style.display='none';drawMsgs();$('ta').focus()}
function decline(){closePanel();agreed=false}
function toggleMax(){maxed=!maxed;$('panel').classList.toggle('max',maxed)}
function toggleAuth(){signed=!signed;render()}
function newSession(){hist=[];drawMsgs();$('ta').value='';grow($('ta'))}
function resetChat(){hist=[];signed=false;agreed=false;render();$('mask').style.display='none';$('panel').classList.remove('open');$('launcher').style.display='flex'}
function togglePM(){pm=!pm;document.body.classList.toggle('pm',pm);$('pm').className=pm?'on':''}
function vote(btn,ok){btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel')}
function grow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,88)+'px'}
function key(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}

function match(text){
  const t=C[lang].q;
  for(const k in t){ if(t[k].ask===text) return k }
  const s=text.toLowerCase();
  for(const k in t){ if(t[k].ask.toLowerCase()===s) return k }
  if(/withdraw|提取|提取/.test(s)) return signed?'refusal':'routing';
  if(/balance|how much|結餘|结余|多少/.test(s)) return signed?'account':'markdown';
  if(/fund|perform|基金|表現|表现/.test(s)) return 'image';
  if(/complain|late|employer|投訴|投诉|僱主|雇主/.test(s)) return 'escalate';
  return 'markdown';
}

function send(){
  const ta=$('ta'), v=ta.value.trim(); if(!v)return;
  ta.value=''; grow(ta); ask(v);
}

function ask(text){
  if(!agreed){openPanel();return}
  $('msgs').querySelector('.empty')?.remove();
  const key=match(text);
  hist.push({k:'user',text:text,key:key});
  drawMsgs();
  const box=$('msgs');
  box.insertAdjacentHTML('beforeend',
    '<div class="row bot" id="typ"><div class="av">AI</div><div class="bub" style="padding:0"><div class="typing"><i></i><i></i><i></i></div></div></div>');
  box.scrollTop=box.scrollHeight;
  setTimeout(()=>{
    const el=$('typ'); if(el)el.remove();
    hist.push({k:'bot',d:C[lang].q[key],key:key});
    drawMsgs();
  },620);
}

function demo(key){
  if(!agreed){openPanel(); setTimeout(()=>{agreed=true;$('mask').style.display='none';
    if(key==='account'&&!signed){signed=true;render()} runDemo(key)},120); return}
  if(key==='account'&&!signed){signed=true;render()}
  runDemo(key);
}
function runDemo(key){
  hist.push({k:'user',text:C[lang].q[key].ask,key:key});
  hist.push({k:'bot',d:C[lang].q[key],key:key});
  drawMsgs();
}

/* language switch: rebuild the whole conversation in the new language */
function setLang(v){
  const keys=hist.map(m=>m.key||'markdown');
  lang=v;
  hist=keys.map((key,i)=> i%2===0
    ? {k:'user',text:C[lang].q[key].ask,key:key}
    : {k:'bot',d:C[lang].q[key],key:key});
  render();
}

render();
